[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incipit"
version = "0.1.7"
description = "Transcription, indexing and review workbench: scans in, reviewed records out"
requires-python = ">=3.10"
# Ranges here, exact versions in constraints.txt -- CI and the workstation install with
# `-c constraints.txt` so they agree on the whole closure.
dependencies = [
    "requests>=2.31,<3",
    "fsspec>=2024.6,<2027",
    "python-dotenv>=1,<2",
    "Pillow>=10,<14",
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "python-multipart>=0.0.9,<1",
    "tomli-w>=1,<2",
    # Announces the site as {name}.local on the client's network (localname.py).
    "zeroconf>=0.130,<1",
    "cryptography>=44,<60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-xdist>=3.5,<4",
    "pytest-timeout>=2.3,<3",
    "httpx>=0.27,<1",
    # The static check CI runs beside the suite; see .gitlab-ci.yml.
    "pyflakes>=3.2,<4",
]
tray = ["pystray>=0.19,<1"]
build = ["pyinstaller>=6,<7", "resvg-py>=0.5,<1", "pystray>=0.19,<1", "playwright>=1.61,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/incipit/app/static" = [
    "app/static/*.html",
    "app/static/*.js",
    "app/static/*.css",
    "app/static/*.svg",
]

[project.scripts]
incipit = "incipit.cli:main"
